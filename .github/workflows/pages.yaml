# Publishes the HTML vignettes (in the CPB style) on GitHub Pages, so
# nobody has to download an .html file to read it. It builds the vignettes
# from vignettes/*.Rmd on every push to main, so no output has to be
# committed.
#
# One setting is needed on GitHub, once: Settings > Pages > Source:
# "GitHub Actions". Pages makes the site public.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.

      - name: Render the vignettes
        run: |
          dir.create("site")
          rmds <- list.files("vignettes", pattern = "[.]Rmd$",
                             full.names = TRUE)
          for (rmd in rmds) {
            rmarkdown::render(rmd, output_dir = "site", quiet = TRUE)
          }
          slugs <- sub("[.]Rmd$", "", basename(rmds))
          titles <- vapply(rmds, function(f) {
            rmarkdown::yaml_front_matter(f)$title
          }, character(1))
          writeLines(c(
            "<!doctype html>",
            "<html><head><meta charset=\"utf-8\"><title>ggcpb</title></head>",
            "<body><h1>ggcpb</h1><ul>",
            sprintf("<li><a href=\"%s.html\">%s</a></li>", slugs, titles),
            "</ul></body></html>"
          ), "site/index.html")
        shell: Rscript {0}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
