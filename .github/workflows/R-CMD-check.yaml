# CI for ggcpb: R CMD check (with tests and vignettes) on Linux and
# Windows, plus a Linux run pinned to ggplot2 3.5 (still on most CPB
# machines; the package supports both 3.5 and 4.x).
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: check (${{ matrix.config.os }}, R ${{ matrix.config.r }}${{ matrix.config.ggplot2 && format(', ggplot2 {0}', matrix.config.ggplot2) || '' }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release', ggplot2: '3.5.2'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.config.ggplot2 && format('ggplot2@{0}', matrix.config.ggplot2) || '' }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
          upload-snapshots: true
